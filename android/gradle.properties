org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Keep aapt2 outside the Gradle cache. The Maven-downloaded aapt2 landed in a
# low-integrity directory and could not write into the project directory.
android.aapt2FromMavenOverride=C:/AndroidSdk/build-tools/36.0.0/aapt2.exe
# Kotlin 增量编译在本机（Windows + 路径含空格）会报
# "Could not close incremental caches ... .tab"，关掉增量即可稳定构建。
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# 1.64：appflowy_editor 带入 file_picker 10.2.4，它把 Kotlin 编译目标设成 1.8，
# 而 Flutter 的 Java 编译目标是 11，Gradle 会报 JVM target 不一致并中断。
# 这里只把"校验模式"降为 warning；1.8 字节码在 JVM 11 上本来就能跑。
# 将来 file_picker 或 appflowy_editor 升级到支持 built-in Kotlin 后可删掉这行。
kotlin.jvm.target.validation.mode=warning
