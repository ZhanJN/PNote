name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 必须锁版本：项目依赖 material_ui（要求 Flutter >= 3.47），
      # 用 channel: stable 会随上游漂移，导致 pub get 在某些日子的 stable 上直接失败。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true

      - name: 环境自检
        run: |
          flutter --version
          dart --version

      - name: 依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 测试
        run: flutter test --reporter expanded
