name: pnote
description: "PNote - 纯局域网 P2P 同步的极简待办与笔记"
publish_to: 'none'
version: 1.63.4+16304

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7
  path_provider: ^2.1.6
  uuid: ^4.6.0
  path: ^1.9.1
  file_selector: ^1.1.0
  flutter_local_notifications: 22.3.3
  timezone: ^0.11.2
  markdown: ^7.3.1

# 固定 path_provider_android 到 2.2.x：2.3.0 起改为依赖 jni_flutter，
# 会在 pub 缓存目录里跑 CMake 编译原生库，本机（Windows + 中文路径）上必然失败。
# 我们只用 getApplicationSupportDirectory()，2.2.23 完全够用。
dependency_overrides:
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 1.33：全局字体换成自带的思源黑体子集（Noto Sans SC，SIL OFL 1.1）。
  # 系统默认会把西文（Segoe UI / Roboto）和中文（雅黑 / Noto CJK）混排，
  # 两种字形的大写字母高度不一样，看起来「有的字大有的字小」。
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
