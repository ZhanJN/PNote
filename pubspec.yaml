name: pnote
description: "PNote - 纯局域网 P2P 同步的极简待办与笔记"
publish_to: 'none'
version: 1.64.0+16400

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7
  path_provider: ^2.1.6
  uuid: ^4.6.0
  path: ^1.9.1
  file_selector: ^1.1.0
  flutter_local_notifications: 22.3.3
  timezone: ^0.11.2
  markdown: ^7.3.1
  appflowy_editor: ^6.2.0

# 固定 path_provider_android 到 2.2.x：2.3.0 起改为依赖 jni_flutter，
# 会在 pub 缓存目录里跑 CMake 编译原生库，本机（Windows + 中文路径）上必然失败。
# 我们只用 getApplicationSupportDirectory()，2.2.23 完全够用。
dependency_overrides:
  path_provider_android: 2.2.23
  # 1.64：file_picker 10.2.4 的 Android 模块还按 compileSdk 34 编译，
  # 而 flutter_plugin_android_lifecycle 要求 36；10.3.x 已升到 36（且支持新的 Kotlin 构建）。
  file_picker: 10.3.11
  # 1.64：keyboard_height_plugin 0.1.5 写死 compileSdk 31、Dart <3.0；
  # 放进 third_party 修正编译参数后按路径引用。
  keyboard_height_plugin:
    path: third_party/keyboard_height_plugin
  # 1.64：把 appflowy_editor 放进 third_party 自己维护。
  # 原因：6.2.0 在 Flutter 3.50 上少实现 TextInputClient.onFocusReceived，
  # 且没有代码块解码器/组件；fork 后可直接改，不再依赖上游发版。
  appflowy_editor:
    path: third_party/appflowy_editor

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 1.33：全局字体换成自带的思源黑体子集（Noto Sans SC，SIL OFL 1.1）。
  # 系统默认会把西文（Segoe UI / Roboto）和中文（雅黑 / Noto CJK）混排，
  # 两种字形的大写字母高度不一样，看起来「有的字大有的字小」。
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
